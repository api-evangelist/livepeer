aid: livepeer
url: https://raw.githubusercontent.com/api-evangelist/livepeer/refs/heads/main/apis.yml
name: Livepeer
kind: company
description: Livepeer is a decentralized video infrastructure network. Independent orchestrators run GPU
  hardware to provide live and on-demand video transcoding services, paid for in ETH/LPT on the Livepeer
  protocol. Livepeer Studio is the managed gateway and developer platform sitting on top of the network,
  exposing a REST API at livepeer.studio/api for live streams, on- demand assets, multistream targets,
  transcoding jobs, sessions, playback, signing keys, AI generation (text-to-image, image-to-image, image-to-video,
  upscale, audio-to-text), and webhooks. Official SDKs are published for JavaScript/TypeScript, Python,
  Go, and Ruby, with React Player and React Broadcast components for client-side playback and ingest.
