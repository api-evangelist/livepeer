apis:
- aid: livepeer:studio
  name: Livepeer Studio REST API
  description: Primary REST API for the Livepeer Studio gateway. Resource-oriented JSON endpoints for
    live streams, on-demand assets, multistream targets, transcoding jobs, sessions, playback, signing
    keys, webhooks, and access controls. Authenticated via API keys issued from the Livepeer Studio dashboard.
  humanURL: https://docs.livepeer.org/api-reference/overview
  baseURL: https://livepeer.studio/api
  tags:
